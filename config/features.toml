# MimiBoot-Mu feature tree (what `python muconfigurator.py` shows)
#
# option fields
#   id        name in .config (MU_<id>=...)            macro    C macro written to mimiboot_config.h
#   kind      bool | int | choice | string             default  value when nothing else applies
#   cores     which cores it exists for: komorebi (32-bit: RP, STM32, nRF, SAMD) / lite (AVR)
#   builds    optional: only for these build kinds (pico / mcu = bare-metal Cortex-M / avr)
#   default_for  { "<build>" = value } overrides per build kind
#   depends   what must hold for this one to be selectable: "ID" (on), "ID=value", "ID!=value"
#             ("ID!=value" also holds when ID doesn't exist for the board), "A|B" (either)
#   range     int bounds; choices: choice values (macro gets the index, *_<VALUE> macros too)
#   menu      which menu it sits in
#
# Turning an option off removes its code: the C side has stubs, and the linker drops them.
#
# [[preset]]: a starting point (TUI "Presets", `muconfigurator.py preset <id>`): every option back to
# its default, then these values; options that don't exist for the board (or that the board
# locks, see targets.toml `locked`) are skipped.

[[menu]]
id = "slots"
title = "Slots and updates"
help = "How many images the board holds and what happens when a new one arrives: A/B pairs, a golden recovery image, trial boots that must be confirmed, rollback, the crash-loop guard."
[[menu]]
id = "formats"
title = "Image formats"
help = "What a slot may contain: MimiBoot's own images, Zephyr / MCUboot images, plain firmware binaries, images that run from RAM."
[[menu]]
id = "security"
title = "Checks and security"
help = "What the bootloader checks before it starts an image: the payload hash (every boot, once, or never), Ed25519 signatures, the trusted keys."
[[menu]]
id = "console"
title = "Console, menu and upload"
help = "The text console on USB (RP) or a UART: boot menu, command line, diagnostic commands, image upload with mbtool, the boot config file."
[[menu]]
id = "os"
title = "Handoff and OS hooks"
help = "What the started image gets from the bootloader and how a running OS can talk back: the handoff block, reboot requests, wiping the bootloader's RAM before the handover."
[[menu]]
id = "hw"
title = "Board hardware"
help = "Console speed and whether the bootloader uses the board's LED and button."
[[menu]]
id = "layout"
title = "Bootloader region"
help = "How much flash the bootloader keeps for itself; the slots start after it. `Show the flash map` on the home screen shows the result."
[[menu]]
id = "lite"
title = "AVR bootloader (Lite core)"
help = "The small AVR core: STK500 uploads (Arduino IDE / avrdude), an app check, app requests, trial boots, a flash-write service, staged updates."
[[menu]]
id = "output"
title = "Build output"
help = "Where `Build` puts the results, and whether to also export a self-contained source tree you can build without MuConfigurator."

# ---- slots and updates ----------------------------------------------------------
[[option]]
id = "LAYOUT"
macro = ""
kind = "choice"
choices = ["single", "ab", "ab+golden"]
default = "ab"
default_for = { pico = "ab+golden" }
cores = ["komorebi"]
builds = ["mcu"]
menu = "slots"
title = "Slots: single / A-B / A-B + golden"
help = """single: one slot, no A/B at all. The smallest setup: a new image simply replaces the old one.
ab: two slots; an update goes to the slot that isn't running, so a bad one can be rolled back.
ab+golden: A/B plus a recovery image that is only ever replaced by a newer version.
(RP boards use fixed presets with A/B + golden.)"""

[[option]]
id = "AUX_SLOTS"
macro = ""
kind = "int"
default = 0
range = [0, 3]
cores = ["komorebi"]
builds = ["mcu"]
depends = ["LAYOUT=ab+golden"]
menu = "slots"
title = "Extra (aux) slots"
help = "More images to boot from menu/config entries: a test build, a second OS, a factory-test firmware."

[[option]]
id = "AB_TRIAL"
macro = "MB_FEAT_AB_TRIAL"
kind = "bool"
default = true
default_for = { mcu = false }
cores = ["komorebi"]
depends = ["LAYOUT!=single"]
menu = "slots"
title = "Updates must confirm (trial boots + automatic rollback)"
help = """A new A/B image gets a few boots to call mb_client_confirm(); if it doesn't, the bootloader goes back to the previous good image.
Off: new images are trusted once their checks pass (right for stock Zephyr, FreeRTOS, Arduino firmware that knows nothing about MimiBoot).
Off by default on bare-metal MCUs. The console's 'confirm' command confirms by hand."""

[[option]]
id = "TRIES"
macro = "MB_DEFAULT_TRIES"
kind = "int"
default = 3
range = [1, 20]
cores = ["komorebi"]
depends = ["AB_TRIAL"]
menu = "slots"
title = "Trial boots before rollback"
help = "How many times an unconfirmed update is started before it is marked bad."

[[option]]
id = "TRIAL_WATCHDOG"
macro = "MB_FEAT_TRIAL_WATCHDOG"
kind = "bool"
default = true
default_for = { mcu = false }
cores = ["komorebi"]
depends = ["AB_TRIAL"]
menu = "slots"
title = "Watchdog during trial boots"
help = """Arm the watchdog before starting a trial image, so a hang also counts as a failed try.
STM32 and nRF: the watchdog can't be stopped once started, so the app must keep refreshing it forever. Off by default on bare-metal MCUs."""

[[option]]
id = "TRIAL_MS"
macro = "MB_DEFAULT_TRIAL_MS"
kind = "int"
default = 15000
range = [1000, 30000]
cores = ["komorebi"]
depends = ["TRIAL_WATCHDOG"]
menu = "slots"
title = "Trial watchdog timeout (ms)"
help = "Images can override it in their header (mbtool pack --trial-ms)."

[[option]]
id = "CRASH_GUARD"
macro = "MB_FEAT_CRASH_GUARD"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["LAYOUT!=single"]
menu = "slots"
title = "Crash-loop guard"
help = "After several watchdog resets in a row of a confirmed image, boot the other good image (or golden) instead. Needs somewhere to fall back to, so not with a single slot."

[[option]]
id = "ANTI_ROLLBACK"
macro = "MB_FEAT_ANTI_ROLLBACK"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "slots"
title = "Anti-rollback (security version floor)"
help = "Once an image with security version N is confirmed, A/B images below N are refused, so nobody can reinstall an old vulnerable build."

# ---- image formats ---------------------------------------------------------
[[option]]
id = "IMG_NATIVE"
macro = "MB_FEAT_IMG_NATIVE"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "formats"
title = "MimiBoot images (mbtool pack)"
help = "The MIMG header: name, version, SHA-256, optional Ed25519 signature, anti-rollback counter, handoff address. The full-featured format."

[[option]]
id = "IMG_MCUBOOT"
macro = "MB_FEAT_IMG_MCUBOOT"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu", "pico"]
menu = "formats"
title = "Zephyr / MCUboot images (imgtool, west sign)"
help = """Boot images in MCUboot format: what Zephyr builds with CONFIG_BOOTLOADER_MCUBOOT=y and signs with imgtool / west sign.
The SHA-256 TLV is checked like any image hash; an ED25519 TLV is checked against the build's keys (sign with: imgtool keygen -t ed25519).
MuConfigurator writes a devicetree overlay (zephyr-partitions.overlay) so the Zephyr app links at the right slot.
A Zephyr app confirms itself MCUboot's way (boot_write_img_confirmed(), the image_ok flag in the slot's trailer): MimiBoot honours that. Not supported: encrypted images, 'pure' signatures, MCUboot swap modes, mcumgr uploads."""

[[option]]
id = "IMG_RAW"
macro = "MB_FEAT_IMG_RAW"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
menu = "formats"
title = "Raw firmware (FreeRTOS, bare metal, Arduino .bin)"
help = """Boot a plain .bin whose vector table sits at the very start of a slot (link the firmware at the slot address).
No metadata means no integrity check: the bootloader only sanity-checks the stack pointer and reset vector.
Prefer wrapping it (mbtool pack, link at slot + 0x1000) when you can."""

[[option]]
id = "RAM_IMAGES"
macro = "MB_FEAT_RAM_IMAGES"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "formats"
title = "RAM images"
help = "Images that are copied to RAM, checked there and started there, and the console's 'ramboot' (try an image without touching flash). The RP2040 port needs this (it can't remap XIP slots)."

# ---- checks and security ------------------------------------------------------------------
[[option]]
id = "BOOT_VERIFY"
macro = "MB_BOOT_VERIFY"
kind = "choice"
choices = ["every-boot", "once", "never"]
default = "every-boot"
cores = ["komorebi"]
menu = "security"
title = "Check the image hash: every boot / once / never"
help = """every-boot: SHA-256 of the whole payload before every start (catches flash corruption; roughly 10-100 ms per 100 KB at reset clocks).
once: the first boot of a new image hashes it and records that in the boot log; later boots only check the header. Faster boots; corruption that happens later goes unnoticed.
never: header checks only. Images uploaded through MimiBoot (mbtool, the client library) are still hashed before their header is written; images written with a debugger are never checked. Fastest; for when something else guarantees the flash.
'Refuse unsigned images' needs every-boot."""

[[option]]
id = "SIGNATURES"
macro = "MB_FEAT_SIGNATURES"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "security"
title = "Ed25519 signatures"
help = "Verify image signatures against the public keys compiled in (KEYS). About 6 KB of code; checks take ~100-500 ms on a Cortex-M at reset clocks."

[[option]]
id = "ECDSA"
macro = "MB_FEAT_ECDSA"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
depends = ["SIGNATURES"]
menu = "security"
title = "ECDSA P-256 signatures as well"
help = """Also accept images signed with ECDSA P-256: MimiBoot images signed with a P-256 key (mbtool keygen --type p256, then pack --key) and Zephyr/MCUboot images signed by imgtool with an ecdsa-p256 key (the ECDSA_SIG TLV). P-256 is on the EU's agreed-mechanisms list; Ed25519 isn't (it is recommended by ETSI TS 119 312).
Put the P-256 public keys (128 hex digits) in the KEYS file next to any Ed25519 ones. The arithmetic is micro-ecc v1.2 (BSD), about 5 KB; a check takes longer than Ed25519 on the small cores."""

[[option]]
id = "LMS"
macro = "MB_FEAT_LMS"
kind = "bool"
default = false
cores = ["komorebi"]
menu = "security"
title = "LMS signatures (hash-based, post-quantum)"
help = """Accept images signed with LMS (RFC 8554, NIST SP 800-208): a signature scheme built on SHA-256 alone, so a quantum computer doesn't break it. CNSA 2.0 names it for firmware signing, and the EU's agreed-mechanisms list has it. Keys: 'mbtool keygen --type lms' (1024 signatures with the default H10, then a new key is needed); put the public key in the KEYS file, Ed25519 off if you want nothing a quantum computer could forge.
LMS keys are stateful: each signature uses up one of the key's one-time keys. mbtool keeps count in the key file and saves it before a signature leaves; never copy that file or sign from two machines with it. The board side only verifies: about 2 KB of code (no Ed25519 needed), no extra RAM at boot (the signature is read from flash as it is checked), plus one signature-sized buffer (1.3-3 KB) for uploads. A check is ~600 SHA-256 blocks with W4 keys (the default), ~4400 with W8. Console unlock, signed configs and revocation statements stay Ed25519."""

[[option]]
id = "REQUIRE_SIGNATURE"
macro = "MB_REQUIRE_SIGNATURE"
kind = "bool"
default = false
cores = ["komorebi"]
depends = ["SIGNATURES|LMS"]
menu = "security"
title = "Refuse unsigned images (secure boot)"
help = "Only images signed by one of KEYS boot. Needs KEYS, and the hash on every boot."

[[option]]
id = "KEYS"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
depends = ["SIGNATURES|LMS"]
menu = "security"
title = "Trusted public keys file"
help = "A text file with one public key per line: Ed25519 (64 hex digits, what mbtool keygen writes to keys/mimiboot.pub), P-256 (128, with ECDSA on) or LMS (112, with LMS on). Enter a path; quotes are fine."

[[option]]
id = "REVOKE_KEYS"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
builds = ["mcu"]
depends = ["SIGNATURES"]
menu = "security"
title = "Key revocation keys file (who may revoke a signing key)"
help = """Ed25519 public keys (one per line) whose statements make the board stop trusting one of its signing keys: 'mbtool revoke --key <revocation key> --keyid <id>'. Keep these keys offline and apart from KEYS: a leaked image key must not be able to revoke the good ones. The revocation is kept in the protected store, so it needs one: nRF with PROTECTED_FLOOR, or a two-stage build. A board never revokes the last key of a kind. Images signed only by a revoked key stop booting when signatures are required: re-sign them first."""

[[option]]
id = "ENCRYPTED_IMAGES"
macro = "MB_FEAT_ENC"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
depends = ["RECV"]
menu = "security"
title = "Take encrypted images (AES-CTR + X25519, MCUboot's scheme)"
help = """Images can travel encrypted: 'mbtool pack --encrypt <board.pub>' (or imgtool's ECIES-X25519 key envelope, the same format) encrypts the payload with a fresh AES key and wraps that key for the board. MimiBoot decrypts while the image comes in over the console or SMP, so slots hold plaintext, as MCUboot's primary slot does: this keeps update files and the link private, not the chip's flash. The hash and signature cover the plaintext. Apps can't install encrypted images through the client library (the key stays in the bootloader).
The decryption key is compiled in (ENC_KEY): every board built from the binary shares it, and it is only as safe as the bootloader's flash. Lock the debug port (DEBUG_LOCK on nRF, read protection from 'mbtool provision' elsewhere), and don't leave the 'md' memory dump open to anyone (SHELL_DIAG needs CONSOLE_AUTH here). On a Cortex-M3 (STM32F1/F2) the key check's timing depends on the key (its multiplies end early on small numbers), so there CONSOLE_AUTH is required. About 3.5 KB of code (AES, X25519, HMAC/HKDF), 0.5 KB of RAM."""

[[option]]
id = "BOOT_RECORD"
macro = "MB_FEAT_BOOT_RECORD"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
menu = "security"
title = "Boot record for the app (measured boot)"
help = """Right before starting an image that asks for it (an MB_BOOT_RECORD_BUFFER in its RAM, see mimiboot/mb_record.h), MimiBoot writes what held on this boot: signature verified and with which key, payload hashed, trial or not, the rollback floor, the payload hash, the SHA-256 of the bootloader's own image and a measurement binding the two with the image header. A server that knows both builds can recompute the measurement. It is a report the image can pass on, not attestation: nothing in it is signed by the device. Costs about 0.4 KB, and hashing the bootloader takes a few milliseconds on each boot of an image that asks."""

[[option]]
id = "ENC_KEY"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
builds = ["mcu"]
depends = ["ENCRYPTED_IMAGES"]
menu = "security"
title = "Decryption key file (mbtool keygen --type x25519)"
help = """The board's X25519 private key, 64 hex digits ('mbtool keygen --type x25519 --out keys/board' writes board.key, this file, and board.pub, which 'mbtool pack --encrypt' takes). It ends up in the generated config header and the binary: keep the build folder as private as the key."""

[[option]]
id = "CFG_SIGNED"
macro = "MB_FEAT_CFG_SIGNED"
kind = "bool"
default = false
cores = ["komorebi"]
depends = ["CFG_FILE", "SIGNATURES"]
menu = "security"
title = "Only use a boot config signed with your keys"
help = """The boot config decides what boots and with which arguments, so on a locked-down product it shouldn't be something anyone with flash access can rewrite. With this on, a config counts only if it carries an Ed25519 signature from one of KEYS over its text, the target and a version number; anything else is ignored and the built-in entries apply. mbtool cfg push <file> --key <secret> signs it (version: the current time unless --cfg-version).
On chips with the protected floor store (nRF, PROTECTED_FLOOR) an older signed config can't come back once a newer one was used. The console's 'default' command and the app library can't change a signed config; 'cfg reset' goes back to the built-in entries."""

[[option]]
id = "FAULT_HARDENING"
macro = "MB_FEAT_FAULT_HARDENING"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "security"
title = "Harden the boot decision against glitches"
help = """Makes a voltage or clock glitch that skips one instruction much less likely to start an image that failed its checks. The hash and the final signature comparison run in constant time and twice; each check leaves a multi-bit token only when it really passes; right before jumping, the tokens and the rollback floor are checked again, from a different place in the code. A glitch now has to hit two independent spots.
It doesn't make the chip glitch-proof (that takes hardware countermeasures), and costs a few hundred bytes."""

[[option]]
id = "CONSOLE_AUTH"
macro = "MB_FEAT_CONSOLE_AUTH"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
depends = ["SHELL", "SIGNATURES"]
menu = "security"
title = "Console commands that change things need a signed unlock"
help = """Until someone answers the 'unlock' challenge with a key from UNLOCK_KEYS, the console only lets you look (ls, info, verify, log...) and boot an entry as configured. Uploads, confirm/reject/erase, config changes, 'boot ... force', edited args, requests and the ROM loader all need the unlock. mbtool does it for you with --unlock-key.
Five wrong answers lock the console until the next reset. On nRF the challenge comes from the hardware RNG; on other chips it is derived from the boot count and the clock (weaker: see docs/SECURITY.md)."""

[[option]]
id = "UNLOCK_KEYS"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
builds = ["mcu"]
depends = ["CONSOLE_AUTH"]
menu = "security"
title = "Console unlock keys file"
help = "Public keys (one per line, 64 hex digits; mbtool keygen) allowed to unlock the console. Empty: the image keys (KEYS). A separate key is better: whoever holds it can install images over the console, but not sign them."

[[option]]
id = "BOOT_LOCK"
macro = "MB_FEAT_BOOT_LOCK"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["nrf"]
menu = "security"
title = "Lock the bootloader's flash before starting an image"
help = """Right before it jumps, the bootloader write-protects its own region until the next reset (nRF51: MPU PROTENSET, nRF52805/810/811/832: BPROT, nRF52820/833/840: ACL). The started image can't erase or rewrite the bootloader or its keys; it can still write its slots, the boot log and the config.
Protection also holds while a debugger is attached (DISABLEINDEBUG cleared); flashing with a debugger still works because it resets the chip first.
Other chips lock their bootloader with persistent fuses or option bytes instead: mbtool provision prints the commands."""

[[option]]
id = "LOCK_GOLDEN"
macro = "MB_FEAT_LOCK_GOLDEN"
kind = "bool"
default = true
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["nrf"]
depends = ["BOOT_LOCK", "LAYOUT=ab+golden"]
menu = "security"
title = "Lock the golden (recovery) slot too"
help = """With the bootloader's flash lock on, also write-protect the golden slot until reset, so a compromised app can't erase or replace the image the board falls back to. A new golden image is still installed through MimiBoot itself (console 'recv g force', mbtool), which runs before the lock; the app library can no longer write it."""

[[option]]
id = "PROTECTED_FLOOR"
macro = "MB_FEAT_PROTECTED_FLOOR"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["nrf"]
depends = ["BOOT_LOCK"]
menu = "security"
title = "Keep the rollback floors in the locked region"
help = """The anti-rollback floor and the newest golden version are kept in the last 4 KB of the bootloader region as well as in the boot log. The log is ordinary flash an app can rewrite; the copy in the locked region isn't, so a compromised app can't lower the floor and reinstall an old signed image.
Costs one 4 KB page of the bootloader region (room for 256 raises)."""

[[option]]
id = "DEBUG_LOCK"
macro = "MB_FEAT_DEBUG_LOCK"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["nrf"]
menu = "security"
title = "Keep the debug port closed"
help = """On nRF52 parts with the newer APPROTECT (most built since 2021), debug access is closed at reset and firmware opens it only if UICR says so. On: the bootloader never opens it and forces it closed until the next reset (APPROTECT.FORCEPROTECT), so neither it nor the app it starts can be debugged. Off: the bootloader opens it when UICR.APPROTECT is 0x5A, as Nordic's startup code does.
Recovering a locked chip takes a full erase (nrfjprog --recover), which also removes the bootloader. Older nRF52 silicon and the nRF51 are locked with UICR alone: mbtool provision prints the command."""

# ---- console -----------------------------------------------------------------------
[[option]]
id = "CONSOLE"
macro = "MB_FEAT_CONSOLE"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "console"
title = "Console with boot menu"
help = "USB (RP) or UART (STM32, nRF, SAMD) text console with the boot menu. Without it, a board with nothing bootable falls back to the chip's ROM loader (RP, STM32; nRF and SAMD have none and wait for a debugger)."

[[option]]
id = "SHELL"
macro = "MB_FEAT_SHELL"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["CONSOLE"]
menu = "console"
title = "Command line (ls, boot, confirm, recv, erase, cfg ...)"
help = "The console's command line ('c' in the menu). Off: the menu alone (pick an entry, edit its args, reboot). Uploads need it."

[[option]]
id = "SHELL_DIAG"
macro = "MB_FEAT_SHELL_DIAG"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["SHELL"]
menu = "console"
title = "Diagnostic commands (md memory dump, sha, log, layout, keys)"
help = "Handy on the bench. Turn off for products: 'md' reads any flash or RAM the bootloader can see."

[[option]]
id = "RECV"
macro = "MB_FEAT_RECV"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["SHELL"]
menu = "console"
title = "Image upload over the console (mbtool install / ota / ramboot)"
help = "Receive images in CRC-checked frames and write them to a slot."

[[option]]
id = "CONSOLE_USB"
macro = "MB_CONSOLE_USB"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["samd"]
depends = ["CONSOLE"]
menu = "console"
title = "Console over native USB (CDC serial port) instead of the UART"
help = """The menu, command line, uploads and SMP over the chip's own USB port, as a serial port the host sees with no driver: for boards whose only connection is USB (Feather M0/M4, Trinket M0, XIAO). TinyUSB (MIT, vendored unmodified) does the USB; the 48 MHz it needs comes from the DFLL locked to the host (no crystal). USB comes up only when the console is wanted: the button, nothing bootable, or the app asking for the menu (there's no key-at-reset break-in over USB), and is taken down completely before an image starts. About 8 KB. Built only: not run on a board yet."""

[[option]]
id = "USB_VID"
macro = "MB_USB_VID"
kind = "int"
default = 4617
range = [1, 65535]
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["samd"]
depends = ["CONSOLE_USB"]
menu = "console"
title = "USB vendor ID (decimal; 4617 = 0x1209, pid.codes)"
help = "With USB_PID the identity the host sees. The default 0x1209:0x0001 is pid.codes' test ID: fine on the bench, not for a product (pid.codes gives open-source projects their own PID for free)."

[[option]]
id = "USB_PID"
macro = "MB_USB_PID"
kind = "int"
default = 1
range = [1, 65535]
cores = ["komorebi"]
builds = ["mcu"]
vendors = ["samd"]
depends = ["CONSOLE_USB"]
menu = "console"
title = "USB product ID (decimal)"
help = "See USB_VID."

[[option]]
id = "SMP"
macro = "MB_FEAT_SMP"
kind = "bool"
default = false
cores = ["komorebi"]
depends = ["RECV"]
menu = "console"
title = "mcumgr / SMP on the console (Zephyr's update tools)"
help = """Speak the Simple Management Protocol on the console's UART, the subset MCUboot's serial recovery offers: image list, upload, test/confirm, erase, reset, echo, MCUmgr parameters. mcumgr, smpmgr, AuTerm and smpclient can then update the board: MimiBoot images and imgtool-signed Zephyr images alike. Open the console first (button, a key right after reset, or the app's request); SMP lines and the menu share the UART.
"image" 0 means the A/B slot an update goes to, "image" N the Nth slot (as in MCUboot's direct upload). Golden is never written over SMP. With CONSOLE_AUTH, writes need the console unlocked. About 4 KB of code and SMP_BUF + 1.5 KB of RAM."""

[[option]]
id = "SMP_BUF"
macro = "MB_SMP_BUF"
kind = "int"
default = 1024
range = [256, 4096]
cores = ["komorebi"]
depends = ["SMP"]
menu = "console"
title = "SMP packet buffer (bytes)"
help = "The largest SMP message the board takes (told to clients as buf_size). Bigger uploads faster, costs RAM."

[[option]]
id = "CFG_FILE"
macro = "MB_FEAT_CFG_FILE"
kind = "bool"
default = true
default_for = { mcu = false }
cores = ["komorebi"]
menu = "console"
title = "Boot config file in flash (entries, args, default, timeout)"
help = """A small GRUB-ish text config kept in two flash sectors (atomic updates). Without it the built-in entries apply: os (A/B), recovery (golden), one per aux slot.
Off by default on bare-metal MCUs: on STM32F2/F4/F7 it costs two extra erase sectors (64-128 KB each); elsewhere 8-16 KB."""

[[option]]
id = "GRUB"
macro = "MB_FEAT_GRUB"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["CFG_FILE"]
menu = "console"
title = "GRUB-style menuentry syntax"

[[option]]
id = "MENU_SECS"
macro = "MB_MENU_SECS"
kind = "int"
default = 10
range = [1, 600]
cores = ["komorebi"]
depends = ["CONSOLE"]
menu = "console"
title = "Boot menu countdown (s)"
help = "How long the menu waits before booting the default entry, unless the config file says otherwise."

[[option]]
id = "BREAK_IN_MS"
macro = "MB_BREAK_IN_MS"
kind = "int"
default = 300
range = [0, 5000]
cores = ["komorebi"]
builds = ["mcu"]
depends = ["CONSOLE"]
menu = "console"
title = "UART break-in window after reset (ms)"
help = "Any key on the console UART within this window opens the menu (like U-Boot's autoboot delay). 0: only the button / OS requests open it, and boots don't wait at all."

# ---- handoff and OS hooks ---------------------------------------------------------------------
[[option]]
id = "HANDOFF"
macro = "MB_FEAT_HANDOFF"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "os"
title = "Boot handoff (slot, entry, args, reset cause -> the image's RAM)"
help = "A checksummed block the image finds at the address its header names: which slot and entry it was started from, the args, why the chip reset."

[[option]]
id = "CONTROL"
macro = "MB_FEAT_CONTROL"
kind = "bool"
default = true
cores = ["komorebi"]
menu = "os"
title = "OS control service (reboot into menu / entry / slot / flash mode)"
help = "Lets a running OS queue a versioned request (mb_client_request) that the bootloader consumes on the next boot."

[[option]]
id = "OS_HOOKS"
macro = "MB_FEAT_OS_HOOKS"
kind = "bool"
default = true
cores = ["komorebi"]
depends = ["HANDOFF"]
menu = "os"
title = "OS hooks: how the last run ended, the RAM mailbox, handoff v2"
help = """The started image gets more in its handoff (v2): what this bootloader was built with, how the previous run ended (a reboot, an update, a power-off, a panic with its message and address, the watchdog), trial state, how long the boot took, and random bytes for its RNG where the chip has one.
And before it resets, the running OS can leave a note in its handoff buffer: why it is resetting (a reboot, an update, a power-off, a panic with a message and an address) and what to boot next (the menu, an entry, a slot, flash mode). MimiBoot reads it first thing, uses it once, and hands "how the last run ended" to the next boot. Nothing is written to flash, so an OS can reboot into the menu as often as it likes. A panic noted here counts as a crash for the crash-loop guard.
RAM survives a reset but not a power cut: a lost note means a normal boot, and requests that must survive power loss go to the boot log in flash (the client library picks). Needs the image's handoff buffer at its full size (images built with this MimiBoot's headers have it)."""

[[option]]
id = "SCRUB_RAM"
macro = "MB_FEAT_SCRUB_RAM"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
menu = "os"
title = "Wipe the bootloader's RAM before handing over"
help = "On the way out the bootloader zeroes its own RAM region (its data, boot log copy, config text, stack) from registers only, then jumps: the image starts with nothing of the bootloader left in RAM. The handoff block lives in the image's RAM and survives. Costs a few microseconds."

# ---- board hardware ----------------------------------------------------------------------------------
[[option]]
id = "BAUD"
macro = "MB_UART_BAUD"
kind = "int"
default = 115200
range = [9600, 1000000]
cores = ["komorebi", "lite"]
builds = ["mcu", "avr"]
menu = "hw"
title = "Console / upload baud rate"

[[option]]
id = "BOARD_LED"
macro = "MB_FEAT_LED"
kind = "bool"
default = true
cores = ["komorebi"]
builds = ["mcu"]
menu = "hw"
title = "Use the board LED (lit while the bootloader waits for a key)"
help = "Off: the bootloader never touches the LED pin."

[[option]]
id = "BOARD_BUTTON"
macro = "MB_FEAT_BUTTON"
kind = "bool"
default = true
cores = ["komorebi"]
builds = ["mcu"]
menu = "hw"
title = "Board button opens the menu"
help = "Off: the bootloader never reads the button pin (the UART break-in and OS requests still work)."

# ---- flash layout (bare-metal MCUs; RP layouts are fixed presets per flash size) ----------------
[[option]]
id = "BOOT_SIZE"
macro = ""
kind = "string"
default = "chip"
cores = ["komorebi"]
builds = ["mcu"]
menu = "layout"
title = "Bootloader region size (chip / auto / e.g. 32K)"
help = """chip: the chip's default from targets.toml (stable slot addresses across rebuilds).
auto: the smallest sector-aligned region the build fits in (slot addresses change when features change, so apps must be relinked).
32K / 48K ...: a fixed size.
With TWO_STAGE this is stage 0's region (stage 0 + the store); chip means auto there."""

[[option]]
id = "TWO_STAGE"
macro = "MB_FEAT_TWO_STAGE"
kind = "bool"
default = false
cores = ["komorebi"]
builds = ["mcu"]
menu = "layout"
title = "Two-stage bootloader (updatable in the field)"
help = """Split MimiBoot in two. Stage 0 is small and never changes: it checks the two stage-1 copies (s1a, s1b) and starts the best one. Stage 1 is the whole bootloader (console, uploads, A/B, everything), and is updated like an app: upload a new one into the copy that isn't running (mbtool loader), reboot. A new stage 1 is on trial until it gets as far as starting an image; after 3 boots that don't, stage 0 goes back to the old copy.
The build makes stage0.bin, stage1-s1a.img, stage1-s1b.img and mimiboot.bin (stage 0 + stage 1 in s1a: what goes on a new board). Stage-1 images are signed with STAGE1_SIGN_KEY and checked against S1_KEYS, separate from the app keys."""

[[option]]
id = "STAGE1_SIZE"
macro = ""
kind = "string"
default = "auto"
cores = ["komorebi"]
builds = ["mcu"]
depends = ["TWO_STAGE"]
menu = "layout"
title = "Size of each stage-1 copy (auto / e.g. 64K)"
help = "auto: the measured stage 1 plus a quarter for later versions, plus its 4 KB header, rounded up to sectors. A later stage 1 must fit, so leave room."

[[option]]
id = "STAGE1_VERSION"
macro = ""
kind = "string"
default = "1.0.0"
cores = ["komorebi"]
builds = ["mcu"]
depends = ["TWO_STAGE"]
menu = "layout"
title = "Stage-1 version (x.y.z)"
help = "Put in the stage-1 images. Between two working copies stage 0 starts the higher version; raise it with every release."

[[option]]
id = "STAGE1_SECURITY"
macro = ""
kind = "int"
default = 0
range = [0, 1000000]
cores = ["komorebi"]
builds = ["mcu"]
depends = ["TWO_STAGE"]
menu = "layout"
title = "Stage-1 security version (anti-rollback)"
help = "Once a stage 1 with this security version has worked, stage 0 never starts one below it again. Raise it when a release fixes a security hole."

[[option]]
id = "S1_KEYS"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
builds = ["mcu"]
depends = ["TWO_STAGE", "SIGNATURES|LMS"]
menu = "layout"
title = "Stage-1 public keys file"
help = "The keys stage 0 accepts a stage 1 from (Ed25519, P-256 with ECDSA on, or LMS with LMS on), one per line. LMS keys here make the bootloader update path post-quantum; prefer W4 keys (stage 0 checks both copies on every boot). Keep them apart from KEYS: a leaked app key must not be enough to replace the bootloader. Required with REQUIRE_SIGNATURE."

[[option]]
id = "STAGE1_SIGN_KEY"
macro = ""
kind = "string"
default = ""
cores = ["komorebi"]
builds = ["mcu"]
depends = ["TWO_STAGE", "SIGNATURES|LMS"]
menu = "layout"
title = "Sign stage-1 images with (secret key file)"
help = "mbtool keygen's .key file, used by the build to sign stage1-s1a.img and stage1-s1b.img. Empty: they are built unsigned (sign them later with mbtool sign --key)."

# ---- AVR (Lite core) ---------------------------------------------------------------------------------
[[option]]
id = "STK500"
macro = "MU_FEAT_STK500"
kind = "bool"
default = true
cores = ["lite"]
menu = "lite"
title = "Serial upload (STK500v1: avrdude -c arduino, Arduino IDE)"
help = "Speaks the protocol of Arduino's own bootloader, so the IDE / avrdude upload unchanged."

[[option]]
id = "EEPROM_RW"
macro = "MU_FEAT_EEPROM"
kind = "bool"
default = true
cores = ["lite"]
depends = ["STK500"]
menu = "lite"
title = "EEPROM read/write over STK500 (avrdude -U eeprom:...)"

[[option]]
id = "ENTRY"
macro = "MU_ENTRY"
kind = "choice"
choices = ["reset-pin", "every-reset"]
default = "reset-pin"
cores = ["lite"]
depends = ["STK500"]
menu = "lite"
title = "When to listen for an upload"
help = """reset-pin: only after an external reset (reset button, or the IDE pulsing DTR). Power-on and watchdog resets start the app at once.
every-reset: every reset waits the timeout first."""

[[option]]
id = "TIMEOUT_MS"
macro = "MU_TIMEOUT_MS"
kind = "choice"
choices = ["250", "500", "1000", "2000", "4000", "8000"]
default = "1000"
cores = ["lite"]
depends = ["STK500"]
menu = "lite"
title = "Upload wait (ms, a watchdog period)"

[[option]]
id = "VERIFY"
macro = "MU_VERIFY"
kind = "choice"
choices = ["none", "crc32"]
default = "crc32"
cores = ["lite"]
menu = "lite"
title = "Check the app before starting it"
help = """crc32: at the end of every upload the bootloader records the app's length and CRC-32 (top of EEPROM) and checks them on every boot; a damaged app is not started (the loader waits for an upload instead).
Apps flashed some other way (ISP) have no record and start as before.
none: no check, smallest build."""

[[option]]
id = "NOAPP_STAY"
macro = "MU_FEAT_NOAPP_STAY"
kind = "bool"
default = true
cores = ["lite"]
depends = ["STK500"]
menu = "lite"
title = "No (valid) app: stay in the bootloader"

[[option]]
id = "APP_REQUEST"
macro = "MU_FEAT_APP_REQUEST"
kind = "bool"
default = true
cores = ["lite"]
depends = ["STK500"]
menu = "lite"
title = "Apps can reboot into the bootloader (mu_enter_bootloader())"

[[option]]
id = "LITE_HANDOFF"
macro = "MU_FEAT_HANDOFF"
kind = "bool"
default = true
cores = ["lite"]
menu = "lite"
title = "Boot handoff (reset cause in r2 + GPIOR0-2)"
help = "MCUSR in r2 (Optiboot convention) and MimiBoot flags in GPIOR0..2; read with mu_handoff()."

[[option]]
id = "LITE_TRIAL"
macro = "MU_FEAT_TRIAL"
kind = "bool"
default = false
cores = ["lite"]
depends = ["VERIFY=crc32"]
menu = "lite"
title = "Trial boots: a new upload must call mu_confirm()"
help = """After an upload the app runs under the watchdog; if it resets MU_TRIAL_TRIES times without calling mu_confirm(), the bootloader stops starting it and waits for a new upload.
Off by default: ordinary sketches never confirm."""

[[option]]
id = "LITE_TRIES"
macro = "MU_TRIAL_TRIES"
kind = "int"
default = 3
range = [1, 15]
cores = ["lite"]
depends = ["LITE_TRIAL"]
menu = "lite"
title = "Trial boots before giving up"

[[option]]
id = "SPM_API"
macro = "MU_FEAT_SPM_API"
kind = "bool"
default = false
cores = ["lite"]
menu = "lite"
title = "Flash-write service for apps (mu_spm(): OTA, data in flash)"
help = "A fixed jump table at the end of flash: apps call the bootloader's SPM routine to erase/write their own flash pages (AVR only allows SPM from the boot section)."

[[option]]
id = "STAGED_UPDATE"
macro = "MU_FEAT_STAGED"
kind = "bool"
default = false
cores = ["lite"]
depends = ["SPM_API", "VERIFY=crc32"]
menu = "lite"
title = "Staged updates (app writes a new image to upper flash, bootloader installs it)"
help = """The running app stores a new image in the top half of the app area (mu_spm), then calls mu_stage_commit(len, crc32) and reboots.
The bootloader checks the CRC, copies it over the app (resumes after a power cut) and records it."""

[[option]]
id = "LED"
macro = "MU_FEAT_LED"
kind = "bool"
default = true
cores = ["lite"]
menu = "lite"
title = "Blink the board LED while the bootloader listens"

# ---- build output ------------------------------------------------------------------------------------
[[option]]
id = "OUTPUT_DIR"
macro = ""
kind = "string"
default = "~/MimiBoot"
cores = ["komorebi", "lite"]
menu = "output"
title = "Output folder (each board gets a subfolder)"
help = """Where builds go: <folder>/<board>/. The default is MimiBoot in your home folder.
Type any path, with or without quotes ("D:/firmware/boot" or ~/projects/boot). `muconfigurator.py build -o DIR` overrides it for one build."""

[[option]]
id = "EXPORT_SOURCE"
macro = ""
kind = "bool"
default = false
cores = ["komorebi", "lite"]
menu = "output"
title = "Also export the configured source tree (with a Makefile)"
help = "Copies exactly the sources this configuration compiles, the generated config header and linker script, and a Makefile into <output>/source/, so the bootloader can be rebuilt (or audited) without MuConfigurator. RP boards get the CMake project and the build command instead."

# ---- presets ------------------------------------------------------------------------------------------
[[preset]]
id = "minimal"
title = "Minimal: just boot the app"
help = "The smallest bootloader that still checks what it starts. No console, no uploads, one slot, no OS hooks. Flash it, link your firmware for the slot, done."
cores = ["komorebi", "lite"]
values = { LAYOUT = "single", CONSOLE = false, SHELL = false, SHELL_DIAG = false, RECV = false, CFG_FILE = false, CONTROL = false, HANDOFF = false, SIGNATURES = false, ANTI_ROLLBACK = false, RAM_IMAGES = false, CRASH_GUARD = false, AB_TRIAL = false, BOOT_VERIFY = "once", BOARD_LED = false, BOARD_BUTTON = false, VERIFY = "none", EEPROM_RW = false, APP_REQUEST = false, LITE_HANDOFF = false, LED = false }

[[preset]]
id = "hobby"
title = "Hobby: console, uploads, no ceremony"
help = "Everything handy on the bench: boot menu, command line with diagnostics, uploads over the console, A/B slots without trials (new images just boot), Zephyr and raw firmware accepted. No signatures."
cores = ["komorebi", "lite"]
values = { LAYOUT = "ab", AB_TRIAL = false, SIGNATURES = false, IMG_MCUBOOT = true, IMG_RAW = true, CONSOLE = true, SHELL = true, SHELL_DIAG = true, RECV = true, BOOT_VERIFY = "every-boot" }

[[preset]]
id = "product"
title = "Product: safe field updates"
help = "A/B + golden recovery, updates must confirm or roll back, watchdog on trial boots, crash-loop guard, anti-rollback, OS hooks. Signatures are checked when present. Diagnostics off."
cores = ["komorebi", "lite"]
values = { LAYOUT = "ab+golden", AB_TRIAL = true, TRIAL_WATCHDOG = true, CRASH_GUARD = true, ANTI_ROLLBACK = true, HANDOFF = true, CONTROL = true, SIGNATURES = true, SHELL_DIAG = false, BOOT_VERIFY = "every-boot", LITE_TRIAL = true, VERIFY = "crc32" }

[[preset]]
id = "secure"
title = "Secure boot: signed images only"
help = "Only images signed with your keys start (set KEYS: mbtool keygen). Hash on every boot, anti-rollback, no raw/RAM images, no diagnostics, the bootloader's RAM is wiped before the handover. Where the chip can (nRF), the bootloader's flash is locked before an image starts and the rollback floors are kept in the locked region. Console commands that change anything need a signed unlock (mbtool --unlock-key). The debug port is left alone: close it (DEBUG_LOCK, or mbtool provision) once the product is final."
cores = ["komorebi"]
values = { SIGNATURES = true, REQUIRE_SIGNATURE = true, BOOT_VERIFY = "every-boot", ANTI_ROLLBACK = true, IMG_RAW = false, RAM_IMAGES = false, SHELL_DIAG = false, SCRUB_RAM = true, LAYOUT = "ab+golden", AB_TRIAL = true, CRASH_GUARD = true, BOOT_LOCK = true, PROTECTED_FLOOR = true, CONSOLE_AUTH = true, CFG_SIGNED = true }
