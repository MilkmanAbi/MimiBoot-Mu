# MimiBoot-Mu target database
#
#   [family.X]  register addresses / bit positions shared by a chip family
#   [chip.X]    memory: flash, RAM, erase sectors ("4x16K,1x64K,3x128K"), family
#   [board.X]   what you pick in mimiconf: a chip + pins + console settings
#
# status: what has actually been checked, per board (see docs/HARDWARE-STATUS.md)
#   "hardware"  ran on a real board        "emulator"  booted in QEMU / simavr
#   "built"     compiles and links, never ran          "host"  core logic host-tested only
#
# Adding a board is usually a [board] entry for an existing [chip]; a new chip in
# a known family is a [chip] entry. No C needed.
#
# Bare-metal Cortex-M families (build = "mcu") also say: vendor (stm32 / nrf / samd),
# flash_base, clock_hz, vectors (vtor / remap / relay), vtor_align, nvic_words,
# time (systick / timer), mcuboot_hdr (where a Zephyr image's vector table lands).

# ===========================================================================
# STM32 families (bare-metal full core: port/cortexm + port/stm32)
# ===========================================================================
[family.stm32f0]
