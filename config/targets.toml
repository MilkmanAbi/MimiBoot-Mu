# ===========================================================================
# Nordic nRF51 / nRF52 (bare-metal full core: port/cortexm + port/nrf)
#
# MimiBoot sits at 0x0 where Nordic's MBR (and a SoftDevice) would be: firmware
# built for the SoftDevice (nRF5 SDK, the Adafruit/Seeed Arduino nRF52 cores)
# won't run. Zephyr (its own BLE controller), nrfx and FreeRTOS firmware will.
# sectors: 4 KB as the layout sees them (nRF51 pages are 1 KB; the driver walks them)
# pins: "P0.06" style; led / button *_active_high (default false = active low)
# ===========================================================================
[family.nrf52]
maker = "nordic"
core = "night"
build = "mcu"
vendor = "nrf"
cpu = "cortex-m4"
series = 52
flash_base = 0x00000000
clock_hz = 64000000
time = "timer"
page = 4096
approtect_sw = true
nvic_words = 2
vtor_align = 256

[family.nrf51]
maker = "nordic"
core = "night"
build = "mcu"
vendor = "nrf"
cpu = "cortex-m0"
series = 51
flash_base = 0x00000000
clock_hz = 16000000
time = "timer"
page = 1024
vectors = "relay"
irqs = 32
nvic_words = 1
vtor_align = 4

[chip.nrf52832]
family = "nrf52"
flash = "512K"
ram = "64K"
sectors = "128x4K"
boot = "48K"
[chip.nrf52833]
family = "nrf52"
flash = "512K"
ram = "128K"
