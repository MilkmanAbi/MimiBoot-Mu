# ===========================================================================
# Microchip SAM D21 / D51 (bare-metal full core: port/cortexm + port/samd)
#
# MimiBoot sits at 0x0 where the UF2 / SAM-BA bootloader is: flash it with an
# SWD probe, after clearing the BOOTPROT fuse (OpenOCD: at91samd bootloader 0).
# Console: a SERCOM as UART. sercom = n, tx/rx "PB22" style, mux = the PORT
# function letter, rxpo / txpo as in the SERCOM's CTRLA (copied from Zephyr's
# board files; the D21 and D51 encodings differ).
# sectors: 4 KB (D21, 256-byte rows inside) / 8 KB (D51 erase blocks)
# ===========================================================================
[family.samd21]
maker = "microchip"
core = "night"
build = "mcu"
vendor = "samd"
cpu = "cortex-m0plus"
series = 21
flash_base = 0x00000000
clock_hz = 8000000
erase_unit = 256
nvic_words = 1
vtor_align = 256
sercoms = [
  { base = 0x42000800, gclk = 0x14, apb_off = 0x20, apb_bit = 2 },
  { base = 0x42000C00, gclk = 0x15, apb_off = 0x20, apb_bit = 3 },
  { base = 0x42001000, gclk = 0x16, apb_off = 0x20, apb_bit = 4 },
  { base = 0x42001400, gclk = 0x17, apb_off = 0x20, apb_bit = 5 },
  { base = 0x42001800, gclk = 0x18, apb_off = 0x20, apb_bit = 6 },
  { base = 0x42001C00, gclk = 0x19, apb_off = 0x20, apb_bit = 7 },
]

[family.samd51]
maker = "microchip"
core = "night"
build = "mcu"
vendor = "samd"
cpu = "cortex-m4"
series = 51
flash_base = 0x00000000
clock_hz = 48000000
erase_unit = 8192
nvic_words = 5
vtor_align = 1024
mcuboot_hdr = 0x400
sercoms = [
  { base = 0x40003000, gclk = 7, apb_off = 0x14, apb_bit = 12 },
  { base = 0x40003400, gclk = 8, apb_off = 0x14, apb_bit = 13 },
  { base = 0x41012000, gclk = 23, apb_off = 0x18, apb_bit = 9 },
  { base = 0x41014000, gclk = 24, apb_off = 0x18, apb_bit = 10 },
  { base = 0x43000000, gclk = 34, apb_off = 0x20, apb_bit = 0 },
  { base = 0x43000400, gclk = 35, apb_off = 0x20, apb_bit = 1 },
  { base = 0x43000800, gclk = 36, apb_off = 0x20, apb_bit = 2 },
  { base = 0x43000C00, gclk = 37, apb_off = 0x20, apb_bit = 3 },
]

