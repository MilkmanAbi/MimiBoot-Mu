[maker.st]
title = "STMicroelectronics"
categories = ["Nucleo boards", "Blue Pill / Black Pill", "Discovery kits", "Custom boards (bare chip)", "QEMU test boards"]
about = "STM32 Cortex-M MCUs: F0/F1/F3 (Cortex-M0/M3/M4), F2/F4/F7 (M3/M4/M7), L4, G0, G4. Bare-metal full core, UART console, the chip's ROM loader as the fallback."
[maker.nordic]
title = "Nordic Semiconductor"
categories = ["Nordic development kits", "Maker boards (Adafruit, Seeed, Arduino)", "BBC micro:bit"]
about = "nRF52 (Cortex-M4F, Bluetooth LE) and nRF51 (Cortex-M0). Bare-metal full core, UART console. Replaces Nordic's MBR at 0x0: Zephyr / nrfx / FreeRTOS firmware, no SoftDevice."
[maker.microchip]
title = "Microchip / Atmel"
categories = ["AVR: Arduino and classic ATmega", "SAM D21 (Cortex-M0+)", "SAM D51 (Cortex-M4F)"]
about = "Classic AVR (Arduino Uno, Nano, Mega...) with the small Lite core, and SAM D21 / D51 (Arduino Zero, Adafruit M0/M4, Seeed XIAO) with the full core."
[maker.rpi]
title = "Raspberry Pi"
categories = ["Pico boards", "Other RP2350 boards"]
about = "RP2040 and RP2350 (Arm and RISC-V) with the original RP ports on the Pico SDK: USB console, UF2, fixed flash presets."
